name: Recogida diaria de datos

on:
  schedule:
    # 04:15 UTC = 06:15 en Madrid en verano y 05:15 en invierno, de lunes a viernes.
    - cron: "15 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recogida
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -t .

      - name: Recoger licitaciones y ayudas
        run: python -m foco.recoger --salida data --dias 3

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "foco-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos del $(date -u +%F)"
            git push
          fi
