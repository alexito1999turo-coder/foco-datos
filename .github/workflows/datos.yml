name: Recogida diaria de datos

on:
  schedule:
    # Tres intentos de madrugada (UTC): GitHub puede retrasar horas una ejecución programada
    # (el 14 de octubre la de las 04:15 empezó a las 09:28). Basta con que una llegue antes de
    # las 7:45 de Madrid; las demás solo refrescan.
    - cron: "15 0,2,4 * * 1-5"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás en los feeds de la PLACSP"
        default: "3"
      dias_ayudas:
        description: "Días hacia atrás en la BDNS"
        default: "7"

permissions:
  contents: write

concurrency:
  group: recogida
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # La rama al empezar el trabajo, no el commit del disparo: así recoge los datos
          # que haya guardado una ejecución anterior que estuviera en cola.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest discover -s tests -t .

      - name: Recoger licitaciones y ayudas
        run: >
          python -m foco.recoger --salida data
          --dias "${{ github.event.inputs.dias || '3' }}"
          --dias-ayudas "${{ github.event.inputs.dias_ayudas || '7' }}"

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "foco-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos del $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
